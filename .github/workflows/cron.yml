name: Sync Events Backup Cron

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" from GitHub UI

jobs:
  sync-events:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Cron API
        run: |
          curl -X GET "${{ secrets.PROD_URL }}/api/cron/sync-events" \
               -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
               --fail --silent --show-error
